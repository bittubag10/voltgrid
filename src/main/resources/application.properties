server.port=${PORT:8080}
spring.application.name=voltgrid
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/voltgrid_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Security Auto-config
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:voltgrid-dev-only-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-seconds=3600

# Admin seed (set via environment variables, never hardcode)
app.admin.name=Platform Admin
app.admin.email=${ADMIN_EMAIL:admin@voltgrid.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345!}

# Booking
app.booking.payment-hold-minutes=5
app.booking.expiry-check-ms=60000
# A request never waits more than 5 seconds for a row lock
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# Gemini (optional: without a key and model the app simply uses the formula)
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:}
app.gemini.timeout-ms=4000

# Payments (Step 18)
app.payment.mock-enabled=true
app.payment.currency=INR
app.stripe.api-key=${STRIPE_API_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_test_secret_123456789}
app.stripe.base-url=https://api.stripe.com/v1

# Frontend CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}

# Overstay Penalty (Step 20)
app.overstay.grace-period-minutes=10
app.overstay.penalty-rate-per-minute=10.00
app.overstay.check-interval-ms=60000
