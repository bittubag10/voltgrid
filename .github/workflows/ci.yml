name: VoltGrid CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Spring Boot Test Suite (PostgreSQL 16 & Flyway)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: voltgrid_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permissions to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Run Spring Boot Tests with PostgreSQL 16
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/voltgrid_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres_ci_password
          APP_PAYMENT_MOCK_ENABLED: "true"
          APP_JWT_SECRET: "voltgrid-ci-secret-key-32-chars-long-01234567890"
          ADMIN_EMAIL: "admin@voltgrid.com"
          ADMIN_PASSWORD: "Admin12345!"
        run: ./mvnw -B test

  frontend-build:
    name: React + Vite Frontend Build & Assets Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React Vite Production Bundle
        run: npm run build
